name: "SecretShield"
description: "Scans every push and PR for secrets, .env files, and sensitive credentials. Auto-removes on push, blocks merge on PR."
author: "SKKammar"

branding:
  icon: "shield"
  color: "red"

inputs:
  token:
    description: "GitHub token for PR comments and artifact upload"
    required: true
    default: ${{ github.token }}

  auto_remove:
    description: "Auto-delete sensitive files on direct push"
    required: false
    default: "false"

  allow_mutation:
    description: "Explicitly allow mutating the repository on push (auto_remove requires this)"
    required: false
    default: "false"

  fail_on_secrets:
    description: "Fail the job if secrets are found (blocks PR merge)"
    required: false
    default: "true"

  custom_patterns:
    description: "Comma-separated extra regex patterns to scan for"
    required: false
    default: ""

  ignore_paths:
    description: "Comma-separated list of paths to ignore (e.g., 'tests/,*.md')"
    required: false
    default: ""

  severity_threshold:
    description: "Minimum severity to fail on: LOW, MEDIUM, HIGH, CRITICAL"
    required: false
    default: "HIGH"

  scan_scope:
    description: "Scope of the scan (e.g. push, pull_request, all)"
    required: false
    default: "all"
    
  request_id:
    description: "Unique request ID for manual scan tracking"
    required: false
    default: ""

  comment_on_pr:
    description: "Whether to post a comment on the PR with findings"
    required: false
    default: "true"

outputs:
  secrets_found:
    description: "true/false — whether any secrets were detected"
  report_path:
    description: "Path to the JSON scan report artifact"
  total_findings:
    description: "Total number of findings across all rules"
  scan_id:
    description: "Unique scan ID for this run"
  sarif_path:
    description: "Path to the generated SARIF file"

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GITHUB_TOKEN: ${{ inputs.token }}
    AUTO_REMOVE: ${{ inputs.auto_remove }}
    ALLOW_MUTATION: ${{ inputs.allow_mutation }}
    FAIL_ON_SECRETS: ${{ inputs.fail_on_secrets }}
    CUSTOM_PATTERNS: ${{ inputs.custom_patterns }}
    IGNORE_PATHS: ${{ inputs.ignore_paths }}
    SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
    SCAN_SCOPE: ${{ inputs.scan_scope }}
    REQUEST_ID: ${{ inputs.request_id }}
    COMMENT_ON_PR: ${{ inputs.comment_on_pr }}
