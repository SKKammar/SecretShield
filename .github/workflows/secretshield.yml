name: SecretShield Scan
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  repository_dispatch:
    types: [secretshield-scan]

permissions:
  contents: read

concurrency:
  group: secretshield-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run SecretShield
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_secrets: "false"
          auto_remove: "false"
          allow_mutation: "false"
          sarif_upload: "true"
          severity_threshold: "HIGH"
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretshield-report-${{ github.run_id }}
          path: secretshield-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload SARIF
        if: always() && hashFiles('secretshield.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secretshield.sarif
          category: secretshield
