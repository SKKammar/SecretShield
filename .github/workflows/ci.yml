name: CI — Test SecretShield Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-action:
    name: Build & Test Docker Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate action.yml
        uses: reviewdog/action-actionlint@v1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'

      - name: Run shfmt
        run: |
          sudo apt-get install -y shfmt
          shfmt -i 2 -d .

      - name: Run SecretShield (self-scan)
        id: scan
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          severity_threshold: "HIGH"
          auto_remove: "false"
          fail_on_secrets: "true"
          ignore_paths: "tests/fixtures/dirty-repo/,.env.example"
          sarif_upload: "true"

      - name: Upload scan report
        uses: actions/upload-artifact@v4
        with:
          name: secretshield-report
          path: secretshield-report.json

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secretshield.sarif
        continue-on-error: true

      - name: Build Docker image
        run: docker build -t secretshield-action:ci .

      # ─── Test 1: Clean repo — must exit 0 ──────────────────────────────────
      - name: "Test: Clean repo (expect exit 0)"
        run: |
          mkdir -p /tmp/clean-test
          cp -r tests/fixtures/clean-repo/. /tmp/clean-test/
          cd /tmp/clean-test
          git init
          git config user.name "Test"
          git config user.email "test@example.com"
          git add .
          git commit -m "init clean repo"

          docker run --rm \
            -v /tmp/clean-test:/github/workspace \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_EVENT_NAME=push \
            -e GITHUB_REPOSITORY=test/clean-repo \
            -e GITHUB_SHA=abc123def456 \
            -e GITHUB_REF_NAME=main \
            -e AUTO_REMOVE=false \
            -e FAIL_ON_SECRETS=true \
            -e SEVERITY_THRESHOLD=HIGH \
            -e CUSTOM_PATTERNS= \
            -e IGNORE_PATHS= \
            secretshield-action:ci

          echo "✅ Clean repo test passed (exit 0)"

      # ─── Validate clean-repo report schema ─────────────────────────────────
      - name: "Validate: Clean repo JSON schema"
        run: |
          REPORT=/tmp/clean-test/secretshield-report.json
          if [ ! -f "$REPORT" ]; then
            echo "❌ Report not generated for clean repo"
            exit 1
          fi
          node -e "
            const r = require('$REPORT');
            const required = ['scan_id','timestamp','repo','commit','branch','triggered_by','summary','findings'];
            const missing = required.filter(k => !(k in r));
            if (missing.length > 0) { console.error('Missing fields:', missing); process.exit(1); }
            console.log('✅ Schema valid. total_findings:', r.summary.total_findings);
          "

      # ─── Test 2: Dirty repo — must exit 1 ─────────────────────────────────
      - name: "Test: Dirty repo (expect exit 1)"
        run: |
          mkdir -p /tmp/dirty-test
          cp -r tests/fixtures/dirty-repo/. /tmp/dirty-test/
          cd /tmp/dirty-test
          git init
          git config user.name "Test"
          git config user.email "test@example.com"
          git add .
          git commit -m "init dirty repo"

          # Action must FAIL — invert the exit code for this test
          if docker run --rm \
            -v /tmp/dirty-test:/github/workspace \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_EVENT_NAME=push \
            -e GITHUB_REPOSITORY=test/dirty-repo \
            -e GITHUB_SHA=def456abc123 \
            -e GITHUB_REF_NAME=main \
            -e AUTO_REMOVE=false \
            -e FAIL_ON_SECRETS=true \
            -e SEVERITY_THRESHOLD=HIGH \
            -e CUSTOM_PATTERNS= \
            -e IGNORE_PATHS= \
            secretshield-action:ci; then
            echo "❌ Dirty repo test FAILED — scanner should have returned exit 1"
            exit 1
          else
            echo "✅ Dirty repo test passed (correctly exited 1)"
          fi

      # ─── Validate dirty-repo report schema ─────────────────────────────────
      - name: "Validate: Dirty repo JSON schema + findings"
        run: |
          REPORT=/tmp/dirty-test/secretshield-report.json
          if [ ! -f "$REPORT" ]; then
            echo "❌ Report not generated for dirty repo"
            exit 1
          fi
          node -e "
            const r = require('$REPORT');
            // Schema check
            const required = ['scan_id','timestamp','repo','commit','branch','triggered_by','summary','findings'];
            const missing = required.filter(k => !(k in r));
            if (missing.length > 0) { console.error('Missing fields:', missing); process.exit(1); }
            // Findings check
            if (r.summary.total_findings === 0) {
              console.error('❌ Expected findings in dirty repo, got 0');
              process.exit(1);
            }
            // Redaction check — no finding should have a match longer than 9 chars without ****
            for (const f of r.findings) {
              if (f.match && !f.match.includes('****') && f.match.length > 8 && !f.match.startsWith('File:')) {
                console.error('❌ Unredacted match found in finding:', f.id);
                process.exit(1);
              }
            }
            console.log('✅ Schema valid. total_findings:', r.summary.total_findings);
            console.log('   CRITICAL:', r.summary.critical, '| HIGH:', r.summary.high, '| MEDIUM:', r.summary.medium, '| LOW:', r.summary.low);
          "

      # ─── Upload test report as artifact ────────────────────────────────────
      - name: Upload dirty-repo scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretshield-report-ci-${{ github.run_id }}
          path: /tmp/dirty-test/secretshield-report.json
          if-no-files-found: warn

      # ─── Test 3: Malformed config ──────────────────────────────────────────
      - name: "Test: Malformed config (expect exit 1)"
        run: |
          if docker run --rm \
            -v /tmp/clean-test:/github/workspace \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e SEVERITY_THRESHOLD=INVALID_SEVERITY \
            secretshield-action:ci; then
            echo "❌ Malformed config test FAILED — should have returned exit 1"
            exit 1
          else
            echo "✅ Malformed config test passed (correctly exited 1)"
          fi

      # ─── Test 4: PR event on dirty repo ─────────────────────────────────────
      - name: "Test: PR event (no auto-remove)"
        run: |
          # Even with AUTO_REMOVE=true, a pull_request event should NOT remove files
          if docker run --rm \
            -v /tmp/dirty-test:/github/workspace \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_EVENT_NAME=pull_request \
            -e GITHUB_REPOSITORY=test/dirty-repo \
            -e GITHUB_SHA=def456abc123 \
            -e GITHUB_REF_NAME=main \
            -e AUTO_REMOVE=true \
            -e ALLOW_MUTATION=true \
            -e FAIL_ON_SECRETS=true \
            secretshield-action:ci; then
            echo "❌ PR event test FAILED — should have returned exit 1"
            exit 1
          fi
          
          # Check that .env wasn't removed
          if [ ! -f "/tmp/dirty-test/.env" ]; then
            echo "❌ PR event test FAILED — .env was deleted!"
            exit 1
          fi
          echo "✅ PR event test passed (files preserved, correctly exited 1)"

  # ─── Dashboard build check ─────────────────────────────────────────────────
  dashboard-build:
    name: Dashboard — Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
